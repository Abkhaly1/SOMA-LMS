<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Workspace ‹ Headmaster ‹ SOMA LMS</title>
    
    <link rel="stylesheet" href="../../css/design-system.css">
    <link rel="stylesheet" href="../../css/layout.css">
    
    <script type="module" src="../../layouts/global-layout.js"></script>
    <script type="module" src="../../js/auth/auth-guard.js"></script>
</head>
<body>
    <div class="app-layout">
        <app-sidebar role="tenant_admin" active-path="/headmaster/people/index.html"></app-sidebar>
        
        <div class="app-main">
            <app-topbar username="Headmaster Mlimani"></app-topbar>
            
            <main class="app-content-wrapper">
                <div class="app-content" style="padding: 0;">
                    
                    <app-workspace-layout back-url="index.html">
                        
                        <app-workspace-header 
                            title="Asha Mussa" 
                            subtitle="ST-001 • Standard 7 A" 
                            status="Active"
                            initials="AM">
                        </app-workspace-header>
                        
                        <app-workspace-summary>
                            <app-workspace-summary-card label="Attendance Rank" value="98%"></app-workspace-summary-card>
                            <app-workspace-summary-card label="Current Average" value="B+"></app-workspace-summary-card>
                            <app-workspace-summary-card label="Enrollment Year" value="2020"></app-workspace-summary-card>
                        </app-workspace-summary>
                        
                        <app-workspace-tabs active-tab="overview">
                            <button class="workspace-tab" data-target="overview">Overview</button>
                            <button class="workspace-tab" data-target="academic">Academic Profile</button>
                            <button class="workspace-tab" data-target="attendance">Attendance</button>
                            <button class="workspace-tab" data-target="results">Results</button>
                            <button class="workspace-tab" data-target="assessments">Assessments</button>
                            <button class="workspace-tab" data-target="guardian">Guardian</button>
                            <button class="workspace-tab" data-target="documents">Documents</button>
                            <button class="workspace-tab" data-target="discipline">Discipline</button>
                            <button class="workspace-tab" data-target="settings">Settings</button>
                        </app-workspace-tabs>
                        
                        <app-workspace-content tab-id="overview" active="true">
                            <div class="card" style="padding: var(--sp-6);">
                                <h3>Student Overview</h3>
                                <p style="color: var(--c-text-secondary); margin-bottom: var(--sp-4);">General summary of the student's performance and status.</p>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6);">
                                    <div>
                                        <h4 style="font-size: var(--text-sm); color: var(--c-text-muted); text-transform: uppercase; margin-bottom: var(--sp-2);">Quick Actions</h4>
                                        <div style="display: flex; flex-direction: column; gap: var(--sp-2);">
                                            <button class="btn btn-outline" style="justify-content: flex-start;">Generate Report Card</button>
                                            <button class="btn btn-outline" style="justify-content: flex-start;">Reset Portal Password</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </app-workspace-content>
                        
                        <app-workspace-content tab-id="academic">
                            <div class="card" style="padding: var(--sp-6);">
                                <h3>Academic Profile</h3>
                                <app-workspace-loading></app-workspace-loading>
                            </div>
                        </app-workspace-content>
                        
                        <app-workspace-content tab-id="attendance">
                            <div class="card" style="padding: var(--sp-6);">
                                <h3>Attendance Records</h3>
                                <app-table-empty title="No Records" message="Attendance history will be listed here."></app-table-empty>
                            </div>
                        </app-workspace-content>
                        
                        <app-workspace-content tab-id="results">
                            <div class="card" style="padding: var(--sp-6);">
                                <h3>Exam Results</h3>
                                <app-table-empty title="No Results" message="Exam results will be published here."></app-table-empty>
                            </div>
                        </app-workspace-content>

                        <app-workspace-content tab-id="assessments">
                            <div class="card" style="padding: var(--sp-6);">
                                <h3>Continuous Assessments</h3>
                                <app-table-empty title="No Assessments" message="Quizzes and assignments will be listed here."></app-table-empty>
                            </div>
                        </app-workspace-content>
                        
                        <app-workspace-content tab-id="guardian">
                            <div class="card" style="padding: var(--sp-6);">
                                <h3>Guardian Information</h3>
                                <app-table-empty title="John Mussa (Father)" message="0700 123 456"></app-table-empty>
                            </div>
                        </app-workspace-content>

                        <app-workspace-content tab-id="documents">
                            <div class="card" style="padding: var(--sp-6);">
                                <h3>Documents</h3>
                                <app-table-empty title="No Documents" message="Birth certificates and medical forms."></app-table-empty>
                            </div>
                        </app-workspace-content>
                        
                        <app-workspace-content tab-id="discipline">
                            <div class="card" style="padding: var(--sp-6);">
                                <h3>Disciplinary Records</h3>
                                <app-table-empty title="Clean Record" message="No disciplinary actions recorded."></app-table-empty>
                            </div>
                        </app-workspace-content>

                        <app-workspace-content tab-id="settings">
                            <div class="card" style="padding: var(--sp-6);">
                                <h3>Student Settings</h3>
                                <div style="display: flex; flex-direction: column; gap: var(--sp-2);">
                                    <button class="btn btn-outline" style="justify-content: flex-start; color: var(--c-warning); border-color: var(--c-warning);">Suspend Student</button>
                                    <button class="btn btn-outline" style="justify-content: flex-start; color: var(--c-danger); border-color: var(--c-danger);">Transfer Student</button>
                                </div>
                            </div>
                        </app-workspace-content>
                        
                    </app-workspace-layout>
                    
                </div>
            </main>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Entry Workspace ‹ Teacher ‹ SOMA LMS</title>
    
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/teacher-theme.css">
    
    <script type="module" src="../layouts/global-layout.js"></script>
    <script type="module" src="../js/auth/auth-guard.js"></script>
</head>
<body>
    <div class="app-layout">
        <app-sidebar role="teacher" active-path="/teacher/marks.html"></app-sidebar>
        
        <div class="app-main">
            <app-topbar username="Teacher Portal"></app-topbar>
            
            <main class="app-content-wrapper">
                <div class="app-content">
                    <app-breadcrumb path="Teacher, Mark Entry Workspace"></app-breadcrumb>

                    <div class="card" style="margin-top: 14px; padding: 24px;">
                        <h2 style="margin: 0 0 6px; font-size: 20px; font-weight: 800; color: var(--c-text-primary);">📝 Mark Entry Workspace</h2>
                        <p style="margin: 0 0 20px; font-size: 13px; color: var(--c-text-muted);">Dedicated spreadsheet workspace for continuous assessment (CA) and terminal exam scores.</p>

                        <div style="display: flex; gap: 14px; flex-wrap: wrap; background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid var(--c-border-light); margin-bottom: 20px; align-items: center;">
                            <div>
                                <label class="form-label" style="font-size: 12px; font-weight: 700;">Class Stream</label>
                                <select id="mStream" class="form-control" style="width: 190px; font-weight: 700;"><option value="">Select Stream...</option></select>
                            </div>
                            <div>
                                <label class="form-label" style="font-size: 12px; font-weight: 700;">Subject Course</label>
                                <select id="mSubj" class="form-control" style="width: 210px; font-weight: 700;"><option value="">Select Subject...</option></select>
                            </div>
                            <div>
                                <label class="form-label" style="font-size: 12px; font-weight: 700;">Academic Term</label>
                                <select id="mTerm" class="form-control" style="width: 160px; font-weight: 700;">
                                    <option value="Term 1" selected>Term 1</option>
                                    <option value="Term 2">Term 2</option>
                                    <option value="Annual Exam">Annual Exam</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label" style="font-size: 12px; font-weight: 700;">Active Assessment Track</label>
                                <select id="mTrack" class="form-control" style="width: 240px; font-weight: 700;">
                                    <option value="terminal">Terminal Exam (Max: 60)</option>
                                    <option value="ca">Continuous Assessment CA (Max: 40)</option>
                                </select>
                            </div>
                        </div>

                        <div id="marksBoard">
                            <div style="padding: 40px; text-align: center; color: var(--c-text-muted); background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 10px;">
                                💡 Select a class stream and subject course above to auto-load the dynamic student score sheet.
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        let allocs = [];
        document.addEventListener('DOMContentLoaded', async () => {
            const mStream = document.getElementById('mStream');
            const mSubj   = document.getElementById('mSubj');
            const mTerm   = document.getElementById('mTerm');
            const mTrack  = document.getElementById('mTrack');

            try {
                const res = await fetch('/soma-lms/api/teacher/teacher_portal_api.php?action=dashboard', { credentials: 'include' });
                const data = await res.json();
                if (res.ok && data.success) {
                    allocs = data.allocations || [];
                    const streams = [...new Set(allocs.map(a => a.classroom_name))];

                    mStream.innerHTML = '<option value="">Select Stream...</option>' + streams.map(s => `<option value="${s}">${s}</option>`).join('');

                    mStream.addEventListener('change', (e) => {
                        const sel = e.target.value;
                        const subjs = allocs.filter(a => a.classroom_name === sel);
                        mSubj.innerHTML = '<option value="">Select Subject...</option>' + subjs.map(a => `<option value="${a.subject_code}">${a.subject_name} (${a.subject_code})</option>`).join('');
                        autoLoadMarksIfReady();
                    });

                    mSubj.addEventListener('change', autoLoadMarksIfReady);
                    mTerm.addEventListener('change', autoLoadMarksIfReady);
                    mTrack.addEventListener('change', autoLoadMarksIfReady);

                    const params = new URLSearchParams(window.location.search);
                    const initialStream = params.get('stream');
                    const initialSubject = params.get('subject');
                    const initialTrack = params.get('track');
                    const initialTerm = params.get('term');

                    if (initialStream && streams.includes(initialStream)) {
                        mStream.value = initialStream;
                        mStream.dispatchEvent(new Event('change'));
                        if (initialSubject && Array.from(mSubj.options).some(opt => opt.value === initialSubject)) {
                            mSubj.value = initialSubject;
                        }
                    }

                    if (initialStream && initialSubject && Array.from(mSubj.options).some(opt => opt.value === initialSubject)) {
                        if (initialTrack && ['ca', 'terminal'].includes(initialTrack)) {
                            mTrack.value = initialTrack;
                        }
                        if (initialTerm && ['Term 1', 'Term 2', 'Annual Exam'].includes(initialTerm)) {
                            mTerm.value = initialTerm;
                        }
                        autoLoadMarksIfReady();
                    }
                }
            } catch(e) {}
        });

        function autoLoadMarksIfReady() {
            const stream = document.getElementById('mStream').value;
            const subject = document.getElementById('mSubj').value;
            if (stream && subject) {
                loadMarks();
            } else {
                document.getElementById('marksBoard').innerHTML = `
                    <div style="padding: 40px; text-align: center; color: var(--c-text-muted); background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 10px;">
                        💡 Select a class stream and subject course above to auto-load the dynamic student score sheet.
                    </div>
                `;
            }
        }

        async function loadMarks() {
            const stream = document.getElementById('mStream').value;
            const subject = document.getElementById('mSubj').value;
            const term = document.getElementById('mTerm').value;
            const track = document.getElementById('mTrack').value;
            if (!stream || !subject) return;

            const board = document.getElementById('marksBoard');
            board.innerHTML = '<div style="padding: 30px; text-align: center; color: var(--c-text-muted); font-weight: 700;">🔄 Loading score sheet & subject rank positions...</div>';

            try {
                const res = await fetch(`/soma-lms/api/teacher/teacher_portal_api.php?action=get_scoresheet&stream=${encodeURIComponent(stream)}&subject=${encodeURIComponent(subject)}&term=${encodeURIComponent(term)}`, { credentials: 'include' });
                const data = await res.json();
                if (res.ok && data.success) {
                    const roster = data.roster || [];
                    const maxScore = track === 'ca' ? 40 : 60;
                    if (roster.length === 0) {
                        board.innerHTML = '<div style="padding: 30px; text-align: center; color: var(--c-text-muted); font-weight: 700;">⚠️ No active students enrolled in this classroom.</div>';
                        return;
                    }

                    let gradedCount = 0;
                    roster.forEach(s => {
                        const val = track === 'ca' ? s.ca_mark : s.terminal_mark;
                        if (val !== null && val !== undefined && val !== '' && parseFloat(val) > 0) gradedCount++;
                    });

                    let html = `
                        <div style="display: flex; justify-content: space-between; align-items: center; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #065f46; flex-wrap: wrap; gap: 8px;">
                            <div>
                                📌 Context: <strong>${stream}</strong> • Subject: <strong>${subject}</strong> • Term: <strong>${term}</strong> • Active Track: <strong>${track === 'ca' ? 'Continuous Assessment (CA)' : 'Terminal Exam'} (Max: ${maxScore})</strong>
                            </div>
                            <div style="font-weight: 700;">
                                👥 Total Enrolled: <strong>${roster.length}</strong> | Graded: <span class="badge badge-success" style="font-size: 11px;">${gradedCount} / ${roster.length}</span>
                            </div>
                        </div>
                        <div style="border: 1px solid var(--c-border-light); border-radius: 8px; overflow-x: auto;">
                            <table class="table" style="width: 100%; font-size: 13px; margin: 0; border-collapse: collapse;">
                                <thead>
                                    <tr style="background: #0f172a; color: white;">
                                        <th style="padding: 10px 12px; width: 45px;">#</th>
                                        <th style="padding: 10px 12px;">Student Name & ID</th>
                                        <th style="padding: 10px 12px; text-align: center; background:${track==='ca'?'#047857':'#1e293b'};">CA (40)</th>
                                        <th style="padding: 10px 12px; text-align: center; background:${track==='terminal'?'#047857':'#1e293b'};">Terminal (60)</th>
                                        <th style="padding: 10px 12px; text-align: center;">Total (100)</th>
                                        <th style="padding: 10px 12px; text-align: center;">Grade & Remark</th>
                                        <th style="padding: 10px 12px; text-align: center;">Subject Rank Position</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    roster.forEach((s, idx) => {
                        const caVal = s.ca_mark !== null && s.ca_mark !== undefined ? s.ca_mark : '';
                        const termVal = s.terminal_mark !== null && s.terminal_mark !== undefined ? s.terminal_mark : '';
                        const total = s.total_score || 0;
                        const rank  = s.subject_rank || (idx + 1);

                        let rankBadge = '';
                        if (rank === 1) rankBadge = `<span class="badge" style="background:#fef3c7; color:#92400e; border:1px solid #fde68a; font-weight:800; font-size:12px; padding:3px 8px;">🥇 1st Position</span>`;
                        else if (rank === 2) rankBadge = `<span class="badge" style="background:#f1f5f9; color:#334155; border:1px solid #cbd5e1; font-weight:800; font-size:12px; padding:3px 8px;">🥈 2nd Position</span>`;
                        else if (rank === 3) rankBadge = `<span class="badge" style="background:#ffedd5; color:#9a3412; border:1px solid #fed7aa; font-weight:800; font-size:12px; padding:3px 8px;">🥉 3rd Position</span>`;
                        else rankBadge = `<span class="badge" style="background:#f8fafc; color:#64748b; font-weight:700; font-size:11px; padding:3px 8px;">${rank}th Position</span>`;

                        let gradeBadge = s.grade_letter && s.grade_letter !== '-'
                            ? `<span class="badge badge-success" style="font-weight:800; font-size:11px;">${s.grade_letter} - ${s.grade_remark}</span>`
                            : `<span class="badge" style="background:#f1f5f9; color:#64748b; font-weight:700; font-size:11px;">-</span>`;

                        const caInput = track === 'ca'
                            ? `<input type="number" class="form-control mark-input" data-sid="${s.student_id}" value="${caVal}" min="0" max="40" placeholder="0" style="width: 75px; font-weight: 800; text-align: center; height: 34px; border-color: #047857;">`
                            : `<span style="font-weight: 700; color: #475569;">${caVal || '0'}</span>`;

                        const termInput = track === 'terminal'
                            ? `<input type="number" class="form-control mark-input" data-sid="${s.student_id}" value="${termVal}" min="0" max="60" placeholder="0" style="width: 75px; font-weight: 800; text-align: center; height: 34px; border-color: #047857;">`
                            : `<span style="font-weight: 700; color: #475569;">${termVal || '0'}</span>`;

                        html += `
                            <tr style="border-bottom: 1px solid #f1f5f9;">
                                <td style="padding: 10px 12px; font-weight: 700; color: #64748b;">${idx + 1}</td>
                                <td style="padding: 10px 12px;">
                                    <strong style="color: #0f172a; font-size: 14px;">${s.full_name}</strong> 
                                    <span class="badge" style="background:#f1f5f9; color:#475569; font-weight:700; font-size:11px; margin-left: 6px;">${s.user_code || 'STD'}</span>
                                </td>
                                <td style="padding: 10px 12px; text-align: center; background:${track==='ca'?'#f0fdf4':'transparent'};">${caInput}</td>
                                <td style="padding: 10px 12px; text-align: center; background:${track==='terminal'?'#f0fdf4':'transparent'};">${termInput}</td>
                                <td style="padding: 10px 12px; text-align: center; font-weight: 800; color: #0f172a; font-size: 14px;">${total} / 100</td>
                                <td style="padding: 10px 12px; text-align: center;">${gradeBadge}</td>
                                <td style="padding: 10px 12px; text-align: center;">${rankBadge}</td>
                            </tr>
                        `;
                    });

                    html += `
                                </tbody>
                            </table>
                        </div>
                        <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                            <span style="font-size: 12px; color: var(--c-text-muted); font-weight: 600;">⚠️ Scores are validated against track limits (${maxScore}) and live subject positions update automatically on save.</span>
                            <button class="btn btn-primary" id="btnSaveMarksBatch" style="font-weight: 800; background: #047857; border-color: #047857; padding: 10px 24px; border-radius: 6px;" onclick="saveMarks('${subject}', '${track}', '${term}')">💾 Save ${term} Marks Batch</button>
                        </div>
                    `;
                    board.innerHTML = html;
                } else {
                    board.innerHTML = `<div style="color:var(--c-text-danger); padding:20px; text-align:center;">${data.message || 'Error loading score sheet.'}</div>`;
                }
            } catch(e) {
                board.innerHTML = '<div style="color:var(--c-text-danger); padding:20px; text-align:center;">Network connection error.</div>';
            }
        }

        window.saveMarks = async function(subjectCode, trackType, termName) {
            const btn = document.getElementById('btnSaveMarksBatch');
            const inputs = document.querySelectorAll('.mark-input');
            const maxScore = trackType === 'ca' ? 40 : 60;
            const marksData = [];
            let hasError = false;

            inputs.forEach(inp => {
                const valStr = inp.value.trim();
                if (valStr !== '') {
                    const score = parseFloat(valStr);
                    if (isNaN(score) || score < 0 || score > maxScore) {
                        inp.style.borderColor = 'crimson';
                        inp.style.background = '#fef2f2';
                        hasError = true;
                    } else {
                        inp.style.borderColor = '';
                        inp.style.background = '';
                        marksData.push({ student_id: inp.getAttribute('data-sid'), score: score });
                    }
                }
            });

            if (hasError) {
                alert(`Validation Error: Please enter valid scores between 0 and ${maxScore}.`);
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.textContent = '💾 Saving Batch...';
            }

            try {
                const res = await fetch('/soma-lms/api/teacher/teacher_portal_api.php?action=save_marks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ subject_code: subjectCode, track_type: trackType, term: termName, marks: marksData })
                });
                const result = await res.json();
                if (res.ok && result.success) {
                    alert(result.message || `Marks saved successfully for ${termName}!`);
                    loadMarks();
                } else {
                    alert(result.message || 'Error saving marks.');
                }
            } catch(e) {
                alert('Network error while saving marks.');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = `💾 Save ${termName} Marks Batch`;
                }
            }
        };
    </script>
</body>
</html>
